<html>
    <head>
        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    </head>

    <body>

        <div class="container mt-4 margin2">

                Movies <span class="text-primary">DataBase</span>
            </h1>
        

        <div class="#">
            <h4 class="">Title</h4>
            <input  class="input-box" id="title" type="text">
        </div>

        <div class="margin1">
            <h4 class="">Director</h4>
            <input  class="input-box" id="director" type="text">
        </div>

        <div class="margin1">
            <h4 class="">Year</h4>
            <input  class="input-box" id="year" type="text">
        </div>

        <div class=" margin1">

        <div class="margin2 input-box">
            <table class="table table-striped mt-4">

                    <tr>
                        <th>Title</th>
                        <th>Director</th>
                        <th>Year</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="Mlist"> </tbody>
            </table>

        </div>

    <footer class="text-center display-4">Made by Jude Adeoye.</footer>
